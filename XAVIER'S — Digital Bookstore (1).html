<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XAVIER'S — Digital Bookstore</title>
<meta name="description" content="Conhecimento que move. Ideias que transformam. E-books e guias digitais em PDF, com preços em kwanzas.">
<meta property="og:type" content="website">
<meta property="og:title" content="XAVIER'S — Digital Bookstore">
<meta property="og:description" content="Conhecimento que move. Ideias que transformam. E-books e guias digitais em PDF.">
<meta property="og:locale" content="pt_AO">
<meta name="theme-color" content="#04060b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="application/ld+json" id="ld">{}</script>
<style id="xv-css">
:root{
  --black:#04060b;--navy-900:#08101f;--navy-800:#0d1a35;--navy-700:#15264d;--navy-600:#1f3566;
  --gold:#c9a24b;--gold-hi:#e8cc82;--text:#eaeef7;--muted:#9ba7c2;--line:rgba(201,162,75,.2);
  --danger:#ff8b82;--ok:#7bdca6;
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:var(--sans);color:var(--text);line-height:1.6;background:var(--black);
  background-image:radial-gradient(1100px 520px at 75% -80px,rgba(31,53,102,.55),transparent 70%);
  background-repeat:no-repeat;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}
p{margin:0 0 1em}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{font:600 .95rem/1 var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.95em 1.5em;border-radius:var(--r,6px);border:1px solid var(--gold);background:var(--gold);color:#1a1405;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:var(--gold-hi)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--gold-hi)}
.btn.ghost:hover{background:rgba(201,162,75,.12)}
.btn.sm{padding:.65em 1em;font-size:.85rem}
.btn.danger{background:transparent;border-color:rgba(255,139,130,.5);color:var(--danger)}
.btn.danger:hover{background:rgba(255,139,130,.1)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--gold-hi);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;font:inherit;cursor:pointer}

/* demo bar + header */
.demobar{background:var(--navy-700);color:var(--gold-hi);font-size:.85rem;text-align:center;padding:.5em 16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(4,6,11,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font:700 1.45rem/1 var(--serif);letter-spacing:.14em;color:var(--gold-hi)}
.logo small{font-size:.68rem;color:var(--muted);letter-spacing:.12em;margin-top:5px}
.nav{display:flex;gap:22px;margin-left:12px;font-size:.92rem;font-weight:500}
.nav a{color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{color:var(--text);border-color:var(--gold)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.hsearch{display:flex;align-items:center;background:var(--navy-900);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 16px}
.hsearch input{background:none;border:0;color:var(--text);font:inherit;font-size:.9rem;padding:.65em 0;width:190px;outline:none}
.hsearch:focus-within{border-color:var(--gold)}
.icon-btn{background:none;border:0;color:var(--gold-hi);cursor:pointer;padding:8px;border-radius:50%;display:inline-flex;position:relative}
.icon-btn:hover{background:rgba(201,162,75,.12)}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:0;right:-2px;background:var(--gold);color:#1a1405;font:700 .68rem/1 var(--sans);min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}
@media(max-width:860px){
  .top-in{gap:10px}
  .nav{order:3;width:100%;margin:0;overflow-x:auto;gap:20px;padding-bottom:2px}
  .hsearch input{width:110px}
}

/* covers */
.cover{position:relative;aspect-ratio:2/3;container-type:inline-size;border-radius:3px 8px 8px 3px;overflow:hidden;box-shadow:0 22px 40px -14px rgba(0,0,0,.85),0 0 0 1px rgba(232,204,130,.16);background:var(--navy-800)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:9cqw 8cqw 9cqw 13cqw;color:var(--gold-hi)}
.cv::before{content:"";position:absolute;inset:0 auto 0 0;width:5cqw;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(255,255,255,.07))}
.cv>*{position:relative}
.cv-brand{font:700 5cqw/1 var(--sans);letter-spacing:.22em;opacity:.9}
.cv-title{font:600 11.5cqw/1.1 var(--serif);text-wrap:balance}
.cv-sub{font:500 4.4cqw/1.35 var(--sans);color:var(--muted)}
.cv0{background:radial-gradient(circle at 78% 20%,rgba(201,162,75,.38) 0 13%,transparent 13.5%),radial-gradient(circle at 78% 20%,transparent 0 21%,rgba(201,162,75,.2) 21.5% 22.5%,transparent 23%),linear-gradient(160deg,var(--navy-700),var(--black))}
.cv1{background:repeating-linear-gradient(135deg,rgba(201,162,75,.13) 0 2px,transparent 2px 14px),linear-gradient(200deg,var(--navy-600),var(--black))}
.cv2{background:linear-gradient(rgba(201,162,75,.13) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(201,162,75,.13) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(180deg,var(--navy-800),var(--black))}
.cv3{background:repeating-radial-gradient(circle at 100% 100%,rgba(201,162,75,.2) 0 2px,transparent 2px 16px),linear-gradient(160deg,var(--navy-700),var(--navy-900))}
.cv4{background:repeating-linear-gradient(0deg,rgba(201,162,75,.15) 0 6px,transparent 6px 22px),linear-gradient(180deg,var(--navy-600),var(--black))}
.cv5{background:radial-gradient(rgba(201,162,75,.32) 1.5px,transparent 2px) 0 0/14px 14px,linear-gradient(150deg,var(--navy-800),var(--black))}
.tagx{position:absolute;top:10px;right:10px;z-index:2;background:rgba(4,6,11,.8);border:1px solid var(--line);color:var(--gold-hi);font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:999px}

/* hero */
.hero{padding:64px 0 40px}
.hero-g{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.5rem);letter-spacing:-.01em;font-weight:600}
.hero h1 span{display:block}
.hero h1 span+span{color:var(--gold-hi)}
.hero p.lead{font-size:1.12rem;color:var(--muted);max-width:52ch;margin:22px 0 30px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.fan{position:relative;height:430px}
.fan .cover{position:absolute;width:min(210px,44%);animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.fan .cover:nth-child(1){left:2%;top:60px;transform:rotate(-9deg)}
.fan .cover:nth-child(2){left:50%;margin-left:-105px;top:4px;z-index:2;animation-delay:.12s}
.fan .cover:nth-child(3){right:2%;top:70px;transform:rotate(8deg);animation-delay:.24s}
@keyframes rise{from{opacity:0;translate:0 36px}to{opacity:1;translate:0 0}}
@media(max-width:860px){.hero{padding-top:36px}.hero-g{grid-template-columns:1fr}.fan{height:330px}.fan .cover{width:38%}.fan .cover:nth-child(2){margin-left:-19%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* sections */
section.sec{padding:56px 0}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(1.6rem,3vw,2.2rem)}
.sec-h p{margin:6px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 22px}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:24px 14px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;gap:14px}
.pcard-cover{position:relative;display:block;transition:transform .25s}
.pcard-cover:hover{transform:translateY(-5px)}
.pcard-cat{font-size:.8rem;color:var(--gold)}
.pcard h3{font-size:1.1rem;margin:2px 0 6px}
.pcard h3 a:hover{color:var(--gold-hi)}
.pcard-desc{font-size:.86rem;color:var(--muted);margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:auto}
.price{font:600 1.1rem var(--serif);color:var(--gold-hi);white-space:nowrap}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.cats a{padding:22px 8px 22px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cats a:hover b{color:var(--gold-hi)}
.cats b{font:600 1.15rem var(--serif)}
.cats small{color:var(--muted)}
@media(max-width:860px){.cats{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.cats{grid-template-columns:1fr}}
.band{background:linear-gradient(180deg,var(--navy-900),var(--black));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.benefit svg{width:28px;height:28px;color:var(--gold);margin-bottom:12px}
.benefit h3{font-size:1.05rem;margin-bottom:6px}
.benefit p{font-size:.9rem;color:var(--muted);margin:0}
@media(max-width:860px){.benefits{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.benefits{grid-template-columns:1fr}}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.quotes blockquote{margin:0;padding:0 0 0 18px;border-left:2px solid var(--gold);font-family:var(--serif);font-size:1.1rem}
.quotes cite{display:block;margin-top:10px;font:500 .85rem var(--sans);color:var(--muted);font-style:normal}
.faq{max-width:760px}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font:600 1.05rem var(--serif);list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--gold);font-size:1.4rem;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:12px 0 0;color:var(--muted)}

/* catalog */
.page{padding:44px 0 72px}
.page h1{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:8px}
.tools{display:flex;gap:14px;flex-wrap:wrap;margin:26px 0 8px;align-items:center}
.tools input,.tools select,.in{background:var(--navy-900);border:1px solid var(--line);color:var(--text);font:inherit;padding:.8em 1em;border-radius:6px;min-width:0}
.tools input{flex:1;min-width:200px}
.in{width:100%}
.in:focus,.tools input:focus,.tools select:focus{outline:none;border-color:var(--gold)}
textarea.in{min-height:110px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 30px}
.chip{border:1px solid var(--line);background:none;color:var(--muted);padding:.5em 1em;border-radius:999px;cursor:pointer;font:500 .85rem var(--sans)}
.chip:hover{color:var(--text);border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1405}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* product */
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:26px}
.crumbs a:hover{color:var(--gold-hi)}
.pd{display:grid;grid-template-columns:340px 1fr;gap:52px;align-items:start}
.pd .cover{width:100%}
.pd h1{font-size:clamp(1.9rem,4vw,3rem);margin:6px 0 10px}
.pd .price{font-size:1.9rem;display:block;margin:18px 0}
.pd-act{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border-top:1px solid var(--line);margin:24px 0}
.facts div{padding:14px 8px 14px 0;border-bottom:1px solid var(--line)}
.facts small{display:block;color:var(--muted);font-size:.78rem}
.share{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
@media(max-width:820px){.pd{grid-template-columns:1fr;gap:30px}.pd .cover{max-width:260px}}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--navy-900);border-left:1px solid var(--line);z-index:61;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-h h2{font-size:1.3rem}
.dr-b{flex:1;overflow:auto;padding:8px 20px}
.dr-f{padding:18px 20px;border-top:1px solid var(--line)}
.line{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.line h4{font:600 .98rem var(--serif);margin-bottom:4px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;margin-top:8px}
.qty button{background:none;border:0;color:var(--gold-hi);width:32px;height:32px;cursor:pointer;font-size:1.1rem}
.qty span{min-width:26px;text-align:center;font-size:.9rem}
.tot{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--muted)}
.tot.big{color:var(--text);font:600 1.3rem var(--serif);margin:10px 0 16px}

/* checkout & forms */
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.panel{background:var(--navy-900);border:1px solid var(--line);border-radius:10px;padding:24px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.fld small{color:var(--muted);display:block;margin-top:4px}
.fld .err{color:var(--danger)}
.pay{display:grid;gap:10px}
.pay label{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;font-weight:500}
.pay input{accent-color:var(--gold);margin-top:4px}
.pay label:has(input:checked){border-color:var(--gold);background:rgba(201,162,75,.07)}
.pay small{display:block;color:var(--muted);font-weight:400}
.notice{border:1px solid var(--line);border-left:3px solid var(--gold);background:rgba(201,162,75,.06);padding:14px 16px;border-radius:6px;font-size:.9rem;margin:0 0 20px}
.notice.warn{border-left-color:var(--danger)}
.status{display:inline-block;font:600 .8rem var(--sans);padding:4px 12px;border-radius:999px;border:1px solid var(--line)}
.st-pago,.st-entregue{color:var(--ok);border-color:rgba(123,220,166,.4)}
.st-aguarda,.st-comprovativo{color:var(--gold-hi)}
.st-cancelado{color:var(--danger);border-color:rgba(255,139,130,.4)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:14px 0;font-size:.92rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.legal{max-width:760px}
.legal p{color:#cfd6e8;white-space:pre-line}

/* admin */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:22px 0 28px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:.8em 1em;font:600 .92rem var(--sans);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--gold-hi);border-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px}
.stat{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--navy-900)}
.stat small{color:var(--muted)}
.stat b{display:block;font:600 1.6rem var(--serif);color:var(--gold-hi);margin-top:4px}
.arow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.arow .cover{box-shadow:none}
.arow .acts{margin:0}
.ord{border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px;background:var(--navy-900)}
.ord-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.form-g{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:640px){.form-g{grid-template-columns:1fr}}
.form-g .full{grid-column:1/-1}
.set-h{font-size:1.25rem;margin:34px 0 14px;padding-top:24px;border-top:1px solid var(--line)}
.set-h:first-child{margin-top:0;border:0;padding:0}
.chk{display:flex;gap:10px;align-items:center}
.chk input{accent-color:var(--gold)}

/* footer */
footer.foot{border-top:1px solid var(--line);background:var(--black);padding:48px 0 30px;margin-top:20px}
.foot-g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
.foot h4{font:700 .95rem var(--sans);margin-bottom:12px;color:var(--gold-hi)}
.foot a,.foot li{color:var(--muted);font-size:.9rem}
.foot a:hover{color:var(--text)}
.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.foot .copy{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:860px){.foot-g{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.foot-g{grid-template-columns:1fr}}
.fan.one{display:grid;place-items:center}
.fan.one .cover:nth-child(1){position:relative;left:auto;top:auto;right:auto;margin:0;width:min(250px,70%);transform:rotate(-4deg)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--navy-900);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal-b{overflow:auto;padding:22px 24px}
.modal-b h3{font-size:1.35rem;margin:26px 0 10px}.modal-b h3:first-child{margin-top:0}
.modal-b p,.modal-b li{color:#cfd6e8;max-width:62ch}
.modal-b ul{padding-left:20px}
.toc{columns:2;column-gap:32px;padding-left:20px;margin:0 0 24px;color:var(--muted)}
.toc li{margin-bottom:6px;break-inside:avoid}
@media(max-width:640px){.toc{columns:1}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--gold);color:#1a1405;font-weight:600;font-size:.9rem;padding:.8em 1.3em;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="demobar"></div>
<header class="top">

<script type="application/json" id="xv-data">{"products": [{"id": "como-comecar-pequeno-negocio-angola", "title": "Como Começar um Pequeno Negócio em Angola", "author": "XAVIER'S", "cat": "negocios", "price": 4500, "pages": 9, "short": "Um guia simples e prático para transformar uma ideia numa fonte de rendimento: da ideia aos primeiros clientes, passo a passo.", "long": "Guia prático, edição 2026, escrito em linguagem simples e com exemplos adaptados à realidade angolana. Aprende a escolher uma ideia, descobrir se existem clientes, calcular o dinheiro necessário para começar, definir preços, organizar as finanças, divulgar o negócio e conhecer os cuidados legais e fiscais. Inclui um plano de acção para os primeiros 30 dias e um mini-plano de negócio para preencher. Material educativo: não substitui aconselhamento contabilístico, jurídico ou fiscal.", "featured": true, "demo": false, "cover": "", "toc": ["Começa pelo problema, não pelo dinheiro", "Descobre se existem clientes", "Faz um plano de negócio de uma página", "Calcula o dinheiro necessário para começar", "Aprende a definir o preço", "Organiza o dinheiro do negócio", "Divulga o negócio e conquista os primeiros clientes", "Atende bem e transforma clientes em clientes habituais", "Formalização e obrigações em Angola", "Erros que deves evitar", "Plano de acção para os primeiros 30 dias", "Ferramenta prática: o teu mini-plano de negócio"], "sample": "# Introdução\n\nComeçar um pequeno negócio pode parecer difícil, sobretudo quando o dinheiro é limitado ou quando ainda não tens experiência. A boa notícia é que não precisas de começar com uma grande empresa, uma loja luxuosa ou muitos funcionários. Podes começar pequeno, testar a tua ideia, aprender com os clientes e crescer de forma organizada.\n\nEste e-book foi escrito em linguagem simples e com exemplos adaptados à realidade angolana. Vais aprender a escolher uma ideia, conhecer os clientes, calcular custos, definir preços, divulgar o negócio, controlar o dinheiro e perceber alguns cuidados legais e fiscais.\n\n# 1. Começa pelo problema, não pelo dinheiro\n\nUm negócio existe para resolver um problema ou satisfazer uma necessidade. Antes de perguntares «Que negócio dá dinheiro?», pergunta: «Que problema consigo resolver bem e por que razão alguém pagaria por isso?»\n\nExemplos de ideias que podem ser testadas em Angola:\n\n• Venda de refeições, bolos, sumos ou lanches por encomenda.\n• Revenda de roupa, calçado, cosméticos ou acessórios, começando com poucas unidades.\n• Lavagem de carros, limpeza de casas ou pequenos serviços de higienização.\n• Explicações escolares, aulas de informática ou formação em competências profissionais.\n• Design simples, gestão de páginas, fotografia de produtos ou apoio digital a pequenos negócios.\n\nNão escolhas uma ideia apenas porque está na moda. Escolhe algo de que conheças os clientes, consigas executar com qualidade e possas testar sem assumir uma dívida pesada.\n\n# Quer continuar a ler?\n\nOs restantes capítulos, o plano de acção para os primeiros 30 dias e o mini-plano de negócio estão no e-book completo."}], "settings": {}}</script>
<script id="xv-main">
"use strict";
const SELF=document.currentScript.textContent;
/* ========= utilidades ========= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kz=n=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0")+"\u00A0Kz";
const store={mem:{},
  get(k,d){try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v)}catch(e){}return k in this.mem?this.mem[k]:d},
  set(k,v){this.mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Não foi possível guardar os dados neste navegador.")}}};
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
const slug=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"ebook";
const digits=s=>String(s||"").replace(/\D/g,"");
const phoneAO=s=>{let d=digits(s);if(d.length===9)d="244"+d;return d};
const armed={};function twice(k){if(armed[k]){clearTimeout(armed[k]);delete armed[k];return true}armed[k]=setTimeout(()=>delete armed[k],4000);toast("Clique outra vez para confirmar.");return false}
const setPath=(o,p,v)=>{const a=p.split(".");let c=o;a.slice(0,-1).forEach(k=>c=c[k]=c[k]||{});c[a.at(-1)]=v};
const getPath=(o,p)=>p.split(".").reduce((c,k)=>c==null?"":c[k],o);

/* ========= dados ========= */
const CATS=[
  {id:"negocios",name:"Negócios e empreendedorismo"},
  {id:"pessoal",name:"Desenvolvimento pessoal"},
  {id:"direito",name:"Direito e Compliance"},
  {id:"gestao",name:"Gestão e administração"},
  {id:"carreira",name:"Carreira e empregabilidade"},
  {id:"financas",name:"Finanças pessoais"}];
const catName=id=>(CATS.find(c=>c.id===id)||{name:"Geral"}).name;
const LEGAL_TXT={
  termos:"TERMOS E CONDIÇÕES (texto-modelo)\n\nAo comprar na XAVIER'S, o cliente aceita estes termos. Os e-books são produtos digitais, para uso pessoal, e não podem ser revendidos, copiados ou partilhados publicamente. Os preços são apresentados em kwanzas (Kz). A encomenda só é considerada paga depois de a XAVIER'S confirmar a recepção do pagamento.",
  privacidade:"POLÍTICA DE PRIVACIDADE (texto-modelo)\n\nRecolhemos apenas o nome, o e-mail e o telefone necessários para processar a encomenda e entregar o e-book. Não vendemos dados a terceiros. O cliente pode pedir a correcção ou a eliminação dos seus dados através dos contactos da loja.",
  reembolso:"POLÍTICA DE REEMBOLSO E CANCELAMENTO (texto-modelo)\n\nDefina aqui em que condições aceita cancelamentos e reembolsos, o prazo para pedir e a forma de devolução do valor. Por tratar-se de produto digital de entrega imediata, indique claramente o que se aplica após o envio do link de download.",
  digital:"CONDIÇÕES DE VENDA DE PRODUTOS DIGITAIS (texto-modelo)\n\nApós a confirmação do pagamento, o cliente recebe o link de download por WhatsApp ou e-mail. O ficheiro é entregue em formato PDF. O cliente deve guardar uma cópia do ficheiro. Indique aqui o prazo de validade do link, se aplicável.",
  contactos:"CONTACTOS E IDENTIFICAÇÃO COMERCIAL\n\nPreencha em Administração › Definições a denominação social, o NIF e a morada da empresa."};
const DEFAULT_SETTINGS={
  brand:"XAVIER'S",tagline:"Conhecimento que move. Ideias que transformam.",
  heroSub:"Guias digitais em PDF para empreender, crescer na carreira e gerir melhor o seu dinheiro. Receba o link de download assim que o pagamento for confirmado.",
  whatsapp:"",email:"",phone:"",address:"Luanda, Angola",nif:"",
  bank:{name:"",iban:"",holder:""},multicaixa:{number:"",name:""},
  social:{instagram:"",facebook:"",tiktok:""},testimonials:"",legal:LEGAL_TXT};
const FAQ=[
  ["Como recebo o e-book?","Depois de fazer a encomenda, efectue o pagamento e envie o comprovativo. Quando a XAVIER'S confirmar o pagamento, recebe o ficheiro PDF (ou o link de download) por WhatsApp ou e-mail."],
  ["Que métodos de pagamento aceitam?","Transferência bancária e Multicaixa Express, sempre em kwanzas. Os dados de pagamento aparecem depois de confirmar a encomenda."],
  ["Em que formato são os e-books?","PDF, que pode ler no telemóvel, no tablet ou no computador."],
  ["Quanto tempo demora a confirmação?","Depende da verificação do pagamento. Se não receber resposta, contacte-nos pelo WhatsApp indicado no rodapé."],
  ["Posso pedir reembolso?","Consulte a política de reembolso e cancelamento no rodapé da loja."]];

const merge=(b,o)=>{const r=JSON.parse(JSON.stringify(b));for(const k in (o||{})){r[k]=(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])&&typeof b[k]==="object")?merge(b[k],o[k]):o[k]}return r};
const BOOT=(()=>{try{return JSON.parse($("#xv-data").textContent)}catch(e){return {}}})();
const links=store.get("xv_links",{});
let pending=store.get("xv_draft",null);
let products=(pending&&pending.products)||BOOT.products||[];
let settings=merge(DEFAULT_SETTINGS,(pending&&pending.settings)||BOOT.settings||{});
const lk=p=>p?(links[p.id]||""):"";
let cart=store.get("xv_cart",[]);
let orders=store.get("xv_orders",[]);
const saveDraft=()=>{pending={products,settings};store.set("xv_draft",pending)},saveP=saveDraft,saveS=saveDraft, saveC=()=>store.set("xv_cart",cart), saveO=()=>store.set("xv_orders",orders);
const byId=id=>products.find(p=>p.id===id);
const ST={aguarda:"Aguarda pagamento",comprovativo:"Comprovativo enviado",pago:"Pago",entregue:"Entregue",cancelado:"Cancelado"};
const paidOrders=()=>orders.filter(o=>o.status==="pago"||o.status==="entregue");
const enoughData=()=>paidOrders().length>=5;
const salesOf=id=>paidOrders().reduce((s,o)=>s+o.items.filter(i=>i.id===id).reduce((a,i)=>a+i.qty,0),0);

/* ========= componentes ========= */
function cover(p){
  if(p.cover)return `<div class="cover"><img src="${esc(p.cover)}" alt="Capa de ${esc(p.title)}"></div>`;
  const k=Math.max(0,CATS.findIndex(c=>c.id===p.cat))%6;
  return `<div class="cover" role="img" aria-label="Capa de ${esc(p.title)}"><div class="cv cv${k}"><span class="cv-brand">XAVIER'S</span><span class="cv-title">${esc(p.title)}</span><span class="cv-sub">${esc(catName(p.cat))}</span></div></div>`;
}
function card(p){
  return `<article class="pcard"><a class="pcard-cover" href="#/livro/${p.id}" aria-label="Ver ${esc(p.title)}">${cover(p)}${p.demo?'<span class="tagx">Exemplo</span>':""}</a>
  <div><a class="pcard-cat" href="#/catalogo?cat=${p.cat}">${esc(catName(p.cat))}</a><h3><a href="#/livro/${p.id}">${esc(p.title)}</a></h3>
  <p class="pcard-desc">${esc(p.short)}</p>
  <div class="pcard-foot"><span class="price">${kz(p.price)}</span><button class="btn sm" data-act="add" data-id="${p.id}">Adicionar ao carrinho</button></div></div></article>`;
}
const ico={
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4L10 14M21 4l-7 17-4-7-7-4z"/></svg>',
  device:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>'};

/* ========= páginas ========= */
function pHome(){
  const feat=products.filter(p=>p.featured).slice(0,4);
  const fanL=(feat.length>=3?feat:products).slice(0,3),fan=fanL.length>=3?fanL:fanL.slice(0,1);
  const hasSales=enoughData();
  const best=hasSales?[...products].sort((a,b)=>salesOf(b.id)-salesOf(a.id)).slice(0,4):[...products].slice(-4).reverse();
  const quotes=settings.testimonials.split("\n").map(l=>l.split("|").map(s=>s.trim())).filter(a=>a[0]&&a[1]);
  return `
  <section class="hero"><div class="wrap hero-g">
    <div><h1><span>Conhecimento que move.</span><span>Ideias que transformam.</span></h1>
      <p class="lead">${esc(settings.heroSub)}</p>
      <div class="hero-cta"><a class="btn" href="#/catalogo">Explorar e-books</a><a class="btn ghost" href="#/faq">Como funciona</a></div></div>
    <div class="fan ${fan.length<3?"one":""}" aria-hidden="true">${fan.map(cover).join("")}</div>
  </div></section>
  ${feat.length?`<section class="sec"><div class="wrap"><div class="sec-h"><div><h2>E-books em destaque</h2><p>A selecção da casa.</p></div><a class="link" href="#/catalogo">Ver todo o catálogo</a></div><div class="grid">${feat.map(card).join("")}</div></div></section>`:""}
  <section class="sec" style="padding-top:8px"><div class="wrap"><div class="sec-h"><h2>Categorias</h2></div>
    <div class="cats">${CATS.filter(c=>products.some(p=>p.cat===c.id)).map(c=>{const n=products.filter(p=>p.cat===c.id).length;return `<a href="#/catalogo?cat=${c.id}"><b>${c.name}</b><small>${n} ${n===1?"e-book":"e-books"}</small></a>`}).join("")}</div></div></section>
  ${products.length>4?`<section class="sec"><div class="wrap"><div class="sec-h"><div><h2>${hasSales?"Mais vendidos":"Novidades no catálogo"}</h2></div></div><div class="grid">${best.map(card).join("")}</div></div></section>`:""}
  <section class="sec band"><div class="wrap benefits">
    <div class="benefit">${ico.wallet}<h3>Preços em kwanzas</h3><p>Sem conversões. Pague por transferência bancária ou Multicaixa Express.</p></div>
    <div class="benefit">${ico.send}<h3>Entrega digital</h3><p>Recebe o link de download depois de o pagamento ser confirmado.</p></div>
    <div class="benefit">${ico.device}<h3>Leia onde quiser</h3><p>Ficheiros PDF que abrem no telemóvel, no tablet e no computador.</p></div>
    <div class="benefit">${ico.chat}<h3>Apoio directo</h3><p>Fale com a equipa por WhatsApp ou e-mail se precisar de ajuda.</p></div>
  </div></section>
  ${quotes.length?`<section class="sec"><div class="wrap"><div class="sec-h"><h2>O que dizem os clientes</h2></div><div class="quotes">${quotes.map(q=>`<blockquote>${esc(q[1])}<cite>${esc(q[0])}</cite></blockquote>`).join("")}</div></div></section>`:""}
  <section class="sec"><div class="wrap"><div class="sec-h"><h2>Perguntas frequentes</h2></div>${faqHtml()}</div></section>`;
}
function faqHtml(){return `<div class="faq">${FAQ.map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("")}</div>`}
function pFaq(){return `<div class="wrap page"><h1>Perguntas frequentes</h1><p class="muted" style="margin-bottom:30px">Respostas às dúvidas mais comuns sobre encomendas, pagamento e entrega.</p>${faqHtml()}</div>`}

function pCatalog(q){
  const cat=q.get("cat")||"",term=q.get("q")||"",sort=q.get("sort")||"rel";
  const opts=[["rel","Em destaque"],["preco-asc","Preço: do mais baixo"],["preco-desc","Preço: do mais alto"]];
  if(enoughData())opts.push(["pop","Mais vendidos"]);
  return `<div class="wrap page"><h1>Catálogo</h1><p class="muted">Pesquise por título ou palavra-chave e filtre por categoria.</p>
  <div class="tools"><label class="sr" for="cq">Pesquisar no catálogo</label><input id="cq" type="search" placeholder="Pesquisar por título ou palavra-chave" value="${esc(term)}" autocomplete="off">
  <label class="sr" for="csort">Ordenar</label><select id="csort">${opts.map(o=>`<option value="${o[0]}" ${o[0]===sort?"selected":""}>${o[1]}</option>`).join("")}</select></div>
  <div class="chips" id="chips"></div><div id="results"></div></div>`;
}
function renderResults(){
  const h=location.hash.slice(1),q=new URLSearchParams(h.split("?")[1]||"");
  const cat=q.get("cat")||"",term=(q.get("q")||"").toLowerCase().trim(),sort=q.get("sort")||"rel";
  $("#chips").innerHTML=[{id:"",name:"Todas"},...CATS.filter(c=>c.id===cat||products.some(p=>p.cat===c.id))].map(c=>`<button class="chip ${c.id===cat?"on":""}" data-act="cat" data-id="${c.id}">${c.name}</button>`).join("");
  let list=products.filter(p=>(!cat||p.cat===cat)&&(!term||(p.title+" "+p.short+" "+p.long+" "+catName(p.cat)).toLowerCase().includes(term)));
  if(sort==="preco-asc")list.sort((a,b)=>a.price-b.price);
  else if(sort==="preco-desc")list.sort((a,b)=>b.price-a.price);
  else if(sort==="pop"&&enoughData())list.sort((a,b)=>salesOf(b.id)-salesOf(a.id));
  else list.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
  $("#results").innerHTML=list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty"><p>Nenhum e-book encontrado.</p><button class="btn ghost" data-act="clear">Limpar pesquisa e filtros</button></div>`;
}
function setQuery(patch){
  const h=location.hash.slice(1),q=new URLSearchParams(h.split("?")[1]||"");
  for(const k in patch){patch[k]?q.set(k,patch[k]):q.delete(k)}
  const s=q.toString();history.replaceState(null,"","#/catalogo"+(s?"?"+s:""));renderResults();
}

function pProduct(p){
  const rel=products.filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4);
  const url=location.href.split("#")[0]+"#/livro/"+p.id;
  const wa="https://wa.me/?text="+encodeURIComponent(p.title+" — "+url);
  const fb="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url);
  return `<div class="wrap page"><div class="crumbs"><a href="#/">Início</a> / <a href="#/catalogo?cat=${p.cat}">${esc(catName(p.cat))}</a> / ${esc(p.title)}</div>
  <div class="pd"><div style="position:relative">${cover(p)}${p.demo?'<span class="tagx">Exemplo</span>':""}</div>
  <div><a class="pcard-cat" href="#/catalogo?cat=${p.cat}">${esc(catName(p.cat))}</a><h1>${esc(p.title)}</h1><p class="muted">por ${esc(p.author)}</p>
  <span class="price">${kz(p.price)}</span>
  <div class="pd-act"><button class="btn" data-act="add" data-id="${p.id}">Adicionar ao carrinho</button><button class="btn ghost" data-act="buy" data-id="${p.id}">Comprar agora</button></div>
  <p style="max-width:62ch">${esc(p.long||p.short)}</p>${p.sample?`<p><button class="btn ghost sm" data-act="sample" data-id="${p.id}">Ler amostra grátis</button></p>`:""}${(p.toc&&p.toc.length)?`<h2 style="font-size:1.25rem;margin:26px 0 12px">O que vai encontrar</h2><ol class="toc">${p.toc.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`:""}
  <div class="facts"><div><small>Formato</small>PDF</div><div><small>Páginas</small>${p.pages?esc(p.pages):"—"}</div><div><small>Entrega</small>Link após confirmação do pagamento</div></div>
  <div class="share">Partilhar: <a class="link" target="_blank" rel="noopener" href="${wa}">WhatsApp</a><a class="link" target="_blank" rel="noopener" href="${fb}">Facebook</a><button class="link" data-act="copylink" data-url="${esc(url)}">Copiar link</button></div></div></div>
  ${rel.length?`<section style="margin-top:70px"><div class="sec-h"><h2>Também pode gostar</h2></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}

/* ---- carrinho ---- */
const cartTotal=()=>cart.reduce((s,i)=>{const p=byId(i.id);return s+(p?p.price*i.qty:0)},0);
function cleanCart(){cart=cart.filter(i=>byId(i.id)&&i.qty>0)}
function renderCart(){

function validate(f){

}

function openModal(o){const m=$("#modal");m.classList.toggle("open",o);m.setAttribute("aria-hidden",String(!o))}
function sampleHtml(t){
  return String(t).split(/\n\s*\n/).map(b=>{b=b.trim();if(!b)return "";if(b.startsWith("# "))return `<h3>${esc(b.slice(2))}</h3>`;
    const ls=b.split("\n");if(ls.every(l=>l.trim().startsWith("• ")))return `<ul>${ls.map(l=>`<li>${esc(l.trim().slice(2))}</li>`).join("")}</ul>`;
    if(ls[0].startsWith("# "))return `<h3>${esc(ls[0].slice(2))}</h3>`+sampleHtml(ls.slice(1).join("\n\n").replace(/\n/g," "));
    return `<p>${esc(b.replace(/\n/g," "))}</p>`}).join("");
}
function openSample(id){
  const p=byId(id);if(!p||!p.sample)return;
  $("#mt").textContent="Amostra grátis: "+p.title;$("#mb").innerHTML=sampleHtml(p.sample);
  $("#mf").innerHTML=`<div class="acts" style="margin:0"><button class="btn" data-act="add" data-id="${p.id}">Adicionar ao carrinho · ${kz(p.price)}</button><button class="btn ghost" data-act="closemodal">Continuar a ler a página</button></div>`;
  openModal(true);$("#mb").scrollTop=0;
}

   +'<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
   +'<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">'
   +'<script type="application/ld+json" id="ld">{}<\/script><style id="xv-css">'+css+'</style>';
  return "<!DOCTYPE html>\n<html lang=\"pt-AO\"><head>"+head+"</head><body>"+demo.outerHTML+hd.outerHTML+app.outerHTML

let publishing=false;
async function publishSite(btn){
  if(publishing)return;
  let art=null;try{art=window.claude&&await window.claude.use("artifact")}catch(e){}
  if(!art){toast("Só o dono da página pode publicar, e a partir da página aberta no claude.ai.");return}
  publishing=true;if(btn)btn.disabled=true;
  try{await art.publish(buildHtml());pending=null;store.set("xv_draft",null);toast("Alterações publicadas.")}
  catch(e){const c=e&&e.code;toast(c==="conflict"?"A página foi actualizada entretanto. Volte a abrir e repita.":c==="not_writer"||c==="not_granted"?"Esta conta não pode publicar alterações.":"Não foi possível publicar. Tente outra vez.");if(btn)btn.disabled=false}
  publishing=false;
}

/* ========= router ========= */
function route(keep){
  const raw=location.hash.slice(1)||"/",[path,qs=""]=raw.split("?"),q=new URLSearchParams(qs),seg=path.split("/").filter(Boolean),r=seg[0]||"home";
  let html,title="XAVIER'S — Digital Bookstore",desc=settings.tagline+" E-books e guias digitais em PDF, com preços em kwanzas.";
  let ld={"@context":"https://schema.org","@type":"Store",name:"XAVIER'S — Digital Bookstore",description:desc,areaServed:"AO",currenciesAccepted:"AOA"};
  switch(r){
    case "home":html=pHome();break;
    case "catalogo":html=pCatalog(q);title="Catálogo de e-books | XAVIER'S";desc="Explore e-books de negócios, carreira, direito, gestão e finanças pessoais.";break;
    case "livro":{const p=byId(seg[1]);if(p){html=pProduct(p);title=p.title+" | XAVIER'S";desc=p.short;ld={"@context":"https://schema.org","@type":"Product",name:p.title,description:p.short,category:catName(p.cat),brand:{"@type":"Brand",name:"XAVIER'S"},offers:{"@type":"Offer",price:p.price,priceCurrency:"AOA",availability:"https://schema.org/InStock"}}}else html=pNotFound();break}
    case "checkout":if(raw!==route.last)draft=draft;html=pCheckout();title="Finalizar encomenda | XAVIER'S";break;
    case "pedido":html=pOrder(seg[1]);title="Encomenda | XAVIER'S";break;
    case "pedidos":html=pOrders();title="Os meus pedidos | XAVIER'S";break;
    case "faq":html=pFaq();title="Perguntas frequentes | XAVIER'S";break;
    case "legal":html=pLegal(seg[1]);title=(LEGAL_NAMES[seg[1]]||"Informação")+" | XAVIER'S";break;
    case "admin":html=pAdmin();title="Administração | XAVIER'S";break;
    default:html=pNotFound();
  }
  route.last=raw;openModal(false);
  const y=window.scrollY;
  $("#app").innerHTML=html;
  if(!keep)window.scrollTo(0,0);else window.scrollTo(0,y);
  document.title=title;$("meta[name=description]").setAttribute("content",desc);
  $("#ld").textContent=JSON.stringify(ld);
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r&&!(a.dataset.r==="x1")));
  if(r==="catalogo")renderResults();
  if(r!=="checkout"&&r!=="pedido")draft=null;
  renderChrome();
}

  $("#demobar").innerHTML=products.some(p=>p.demo)?`<div class="demobar">Loja em preparação: os e-books mostrados são de demonstração.</div>`:"";
  const s=settings,soc=[["Instagram",s.social.instagram],["Facebook",s.social.facebook],["TikTok",s.social.tiktok]].filter(x=>x[1]);

  <div><div class="logo" style="margin-bottom:14px"><b>XAVIER'S</b><small>Digital Bookstore</small></div><p class="muted" style="font-size:.9rem;max-width:30ch">${esc(s.tagline)}</p></div>
  <div><h4>Loja</h4><ul><li><a href="#/catalogo">Catálogo</a></li><li><a href="#/pedidos">Os meus pedidos</a></li><li><a href="#/faq">Perguntas frequentes</a></li></ul></div>

/* ========= eventos ========= */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case "add":addToCart(id);break;
    case "buy":addToCart(id,true);location.hash="#/checkout";break;
    case "cart":openCart(true);break;
    case "closecart":openCart(false);break;
    case "inc":{const i=cart.find(x=>x.id===id);if(i){i.qty=Math.min(i.qty+1,20);saveC();renderCart()}break}
    case "dec":{const i=cart.find(x=>x.id===id);if(i){i.qty--;if(i.qty<1)cart=cart.filter(x=>x.id!==id);saveC();renderCart()}break}
    case "rm":cart=cart.filter(x=>x.id!==id);saveC();renderCart();break;
    case "cat":setQuery({cat:id});break;
    case "clear":$("#cq").value="";history.replaceState(null,"","#/catalogo");$("#csort").value="rel";renderResults();break;
    case "copylink":copy(t.dataset.url,"Link copiado.");break;
    case "copytext":{const o=orders.find(x=>x.ref===t.dataset.ref);if(o)copy(orderText(o),"Resumo copiado.");break}
    case "edit":draft=draft?{...draft}:null;{const d=draft;draft=null;route(true);if(d){$("#f-name").value=d.name;$("#f-email").value=d.email;$("#f-phone").value=d.phone;$("#f-notes").value=d.notes;document.querySelector(`input[name=method][value=${d.method}]`).checked=true}}break;
    case "confirm":{t.disabled=true;const o=createOrder();cart=[];saveC();draft=null;renderCart();location.hash="#/pedido/"+o.ref;break}
    case "publish":publishSite(t);break;
    case "sample":openSample(id);break;
    case "closemodal":openModal(false);break;
    case "logout":adm.authed=false;try{sessionStorage.removeItem("xv_adm")}catch(x){}route();break;
    case "tab":adm.tab=id;adm.edit=null;route(true);break;
    case "adm-new":adm.edit="new";adm.cover=undefined;route(true);break;
    case "adm-edit":adm.edit=id;adm.cover=undefined;route(true);break;
    case "adm-cancel":adm.edit=null;route(true);break;
    case "adm-del":if(twice("del"+id)){products=products.filter(p=>p.id!==id);delete links[id];store.set("xv_links",links);cart=cart.filter(i=>i.id!==id);saveP();saveC();route(true);toast("E-book removido.")}break;
    case "rmcover":adm.cover="";{const p=adm.edit==="new"?{title:$("#a-title").value||"Título",cat:$("#a-cat").value}:{...byId(adm.edit),title:$("#a-title").value||"Título",cat:$("#a-cat").value};$("#cvprev").innerHTML=cover({...p,cover:""})}break;
    case "ord-del":if(twice("od"+t.dataset.ref)){orders=orders.filter(o=>o.ref!==t.dataset.ref);saveO();route(true)}break;
    case "bk-copy":copy($("#bk").value,"Cópia de segurança copiada.");break;
    case "bk-import":{
      if(!twice("bki"))break;
      try{const d=JSON.parse($("#bki").value);if(!Array.isArray(d.products))throw 0;products=d.products;settings=merge(DEFAULT_SETTINGS,d.settings||{});orders=Array.isArray(d.orders)?d.orders:[];saveP();saveS();saveO();route(true);toast("Cópia reposta.")}catch(x){toast("A cópia de segurança não é válida.")}
      break}
  }
});
function copy(text,msg){
  const fb=()=>{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg)}catch(e){toast("Não foi possível copiar.")}ta.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast(msg),fb);else fb();
}
document.addEventListener("input",e=>{
  if(e.target.id==="cq")setQuery({q:e.target.value});
  if(e.target.id==="a-title"||e.target.id==="a-cat"){const pv=$("#cvprev");if(pv&&!pv.querySelector("img")){const p=adm.edit==="new"?{}:byId(adm.edit)||{};pv.innerHTML=cover({...p,title:$("#a-title").value||"Título",cat:$("#a-cat").value,cover:""})}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="csort")setQuery({sort:e.target.value==="rel"?"":e.target.value});
  if(e.target.id==="a-cat")e.target.dispatchEvent(new Event("input",{bubbles:true}));
  if(e.target.dataset&&e.target.dataset.status){const o=orders.find(x=>x.ref===e.target.dataset.status);if(o){o.status=e.target.value;saveO();route(true);toast("Estado actualizado.")}}
  if(e.target.id==="a-cover"&&e.target.files[0]){
    const f=e.target.files[0],rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{const W=480,H=720,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);adm.cover=c.toDataURL("image/jpeg",.82);$("#cvprev").innerHTML=cover({title:"Capa",cover:adm.cover})};im.onerror=()=>toast("Imagem inválida.");im.src=rd.result};
    rd.readAsDataURL(f);
  }
});
document.addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  switch(f.dataset.form){
    case "hsearch":{const v=$("#hq").value.trim();location.hash="#/catalogo"+(v?"?q="+encodeURIComponent(v):"");break}
    case "checkout":{const d=validate(f);if(d){draft=d;route()}else{const x=f.querySelector(".err:not(:empty)");if(x)x.closest(".fld").querySelector("input").focus()}break}
    case "adm-setup":{const p=f.pin.value,p2=f.pin2.value,er=$("#pin-err");if(p.length<6){er.textContent="O PIN precisa de pelo menos 6 caracteres.";break}if(p!==p2){er.textContent="Os PIN não coincidem.";break}store.set("xv_adm_hash",await sha(p));adm.authed=true;try{sessionStorage.setItem("xv_adm","1")}catch(x){}route();break}
    case "adm-login":{const ok=(await sha(f.pin.value))===store.get("xv_adm_hash",null);if(ok){adm.authed=true;try{sessionStorage.setItem("xv_adm","1")}catch(x){}route()}else $("#pin-err").textContent="PIN incorrecto.";break}
    case "adm-send":{
      const via=(e.submitter&&e.submitter.dataset.via)||"wa",fd=new FormData(f),ids=fd.getAll("sp"),name=(fd.get("sname")||"").trim(),ph=phoneAO(fd.get("sphone")),em=(fd.get("semail")||"").trim();
      if(!ids.length){toast("Escolha pelo menos um e-book.");break}
      if(via==="wa"&&ph.length<11){toast("Indique o WhatsApp do cliente.");break}
      if(via==="mail"&&!em){toast("Indique o e-mail do cliente.");break}
      const o={customer:{name:name},items:ids.map(id=>({id,title:byId(id).title,qty:1}))},txt=deliveryText(o);
      const url=via==="wa"?`https://wa.me/${ph}?text=${encodeURIComponent(txt)}`:`mailto:${em}?subject=${encodeURIComponent("Os seus e-books — "+settings.brand)}&body=${encodeURIComponent(txt)}`;
      const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();break}
    case "adm-pin":{if(f.pin.value.length<6){toast("O PIN precisa de pelo menos 6 caracteres.");break}store.set("xv_adm_hash",await sha(f.pin.value));f.reset();toast("PIN alterado.");break}
    case "adm-settings":{for(const [k,v] of new FormData(f).entries())setPath(settings,k,v.trim?v.trim():v);saveS();route(true);toast("Definições guardadas.");break}
    case "adm-product":{
      const fd=Object.fromEntries(new FormData(f).entries());
      const price=Math.round(Number(fd.price));if(!(price>=0)||isNaN(price)){toast("Indique um preço válido.");break}
      const base={title:fd.title.trim(),author:fd.author.trim()||"XAVIER'S",cat:fd.cat,price,pages:fd.pages?Number(fd.pages):"",short:fd.short.trim(),long:fd.long.trim(),toc:(fd.toc||"").split("\n").map(x=>x.trim()).filter(Boolean),sample:(fd.sample||"").trim(),featured:!!fd.featured,demo:false};
      let pid=adm.edit;
      if(adm.edit==="new"){let id=slug(base.title),n=2;while(byId(id))id=slug(base.title)+"-"+n++;pid=id;products.push({id,...base,cover:adm.cover||""})}
      else{const p=byId(adm.edit);Object.assign(p,base);if(adm.cover!==undefined)p.cover=adm.cover}
      const u=(fd.url||"").trim();if(u)links[pid]=u;else delete links[pid];store.set("xv_links",links);
      saveP();adm.edit=null;adm.cover=undefined;route(true);toast("E-book guardado.");break}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){openCart(false);openModal(false)}});
window.addEventListener("hashchange",()=>route());
route();
